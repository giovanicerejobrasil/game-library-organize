services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: game_library_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        ports:
            - "${APP_PORT:-8000}:8000"
        environment:
            - APP_ENV=${APP_ENV:-local}
            - APP_DEBUG=${APP_DEBUG:-true}
            - DB_CONNECTION=pgsql
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_DATABASE=${DB_DATABASE:-game_library_organize}
            - DB_USERNAME=${DB_USERNAME:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - ELASTICSEARCH_HOST=http://elasticsearch:9200
        depends_on:
            postgres:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        networks:
            - game_network

    postgres:
        image: postgres:16-alpine
        container_name: game_library_postgres
        restart: unless-stopped
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE:-game_library_organize}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
        volumes:
            - game_pgsql_data:/var/lib/postgresql/data
        networks:
            - game_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-game_library_organize}"]
            interval: 5s
            timeout: 5s
            retries: 5

    elasticsearch:
        image: elasticsearch:8.17.2
        container_name: game_library_elasticsearch
        restart: unless-stopped
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ports:
            - "${FORWARD_ES_PORT:-9200}:9200"
        volumes:
            - game_es_data:/usr/share/elasticsearch/data
        networks:
            - game_network
        healthcheck:
            test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
            interval: 10s
            timeout: 5s
            retries: 10

networks:
    game_network:
        driver: bridge

volumes:
    game_pgsql_data:
        driver: local
    game_es_data:
        driver: local
